apis:
- aid: national-bank-of-canada:consumer-data-access-aggregator
  name: National Bank Consumer Data Access (Aggregator-Mediated)
  description: >-
    National Bank of Canada exposes no public, self-serve first-party developer
    API. Consumer financial-data access is consent-based and aggregator-mediated:
    when a customer links a fintech app, National Bank redirects the customer to
    authenticate and grant consent, then shares data through a secure,
    FDX-aligned data feed. This access is delivered principally via Flinks
    (National Bank's ~80%-owned Montreal aggregator) through its Open Banking
    Environment (OBE), and also via Plaid. Fintechs onboard through the
    aggregator's accreditation process rather than a National Bank developer
    console. No National Bank OpenAPI/Swagger is publicly downloadable.
  humanURL: https://www.flinks.com/go/open-banking-api
  tags:
  - Open Banking
  - Data Aggregation
  - FDX
  - Consumer-Driven Banking
  - Flinks
  properties:
