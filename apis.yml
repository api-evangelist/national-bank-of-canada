name: National Bank of Canada
kind: company
description: >-
  National Bank of Canada (Banque Nationale du Canada, TSX: NA) is a Schedule I
  chartered bank headquartered in Montreal, Quebec, founded in 1859. It is the
  sixth-largest of Canada's Big Six banks and the leading bank in Quebec,
  serving personal, commercial, wealth-management, and financial-markets clients.
  On open finance, National Bank is a notable first-mover: it was the first
  major Canadian bank to launch a secure, consent-based data-sharing API for
  retail customers, but it does NOT operate a public self-serve first-party
  developer portal. Programmatic access to customer financial data is delivered
  through aggregators rather than a downloadable public API — principally Flinks,
  the Montreal aggregator in which National Bank holds an ~80% stake, via its
  Open Banking Environment (OBE), and also through Plaid. National Bank and
  Flinks are founding participants of the FDX Canada working group, aligning
  their data-sharing on the FDX technical standard, and the bank is positioning
  ahead of Canada's forthcoming, legislated-but-not-yet-operational
  Consumer-Driven Banking framework (Budget 2024 / FCAC oversight). Today access
  is voluntary and aggregator-mediated; there is no operational open-banking
  mandate and no public first-party API surface.
