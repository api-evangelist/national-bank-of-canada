actions:
  openapiHarvested: false
  reason: |
    No public first-party OpenAPI/Swagger is published by National Bank of Canada.
    The bank exposes no self-serve developer portal; consumer data access is
    aggregator-mediated (Flinks OBE, Plaid) under a consent-redirect model. This
    is recorded as an identity-only (built-stub) profile with an honest
    aggregator-only, FDX-aligned open-finance posture. No spec was fabricated.
