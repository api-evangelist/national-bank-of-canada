aid: national-bank-of-canada
name: National Bank of Canada
review:
  question: Does National Bank of Canada expose a public first-party developer API portal with downloadable specs?
  answer: false
  date: '2026-07-23'
  reviewer: API Evangelist
findings:
  summary: |
    National Bank of Canada (Banque Nationale du Canada, TSX: NA) — a Schedule I
    chartered bank, sixth-largest in Canada and the leading bank in Quebec — does
    NOT operate a public, self-serve first-party developer portal. Candidate
    developer hosts do not resolve (developer.nbc.ca, developers.nbc.ca,
    api.nbc.ca, developer.nationalbank.ca all return connection failures). The
    corporate website (https://www.nbc.ca/) is live (HTTP 200) but exposes no
    API console, no developer documentation, and no downloadable OpenAPI/Swagger.

    National Bank's open-finance posture is aggregator-mediated, and it is an
    early mover: it was the first major Canadian bank to launch a secure,
    consent-based data-sharing feed for retail customers. Rather than a public
    API, access is delivered through aggregators — principally Flinks, the
    Montreal aggregator in which National Bank holds an ~80% stake, via its Open
    Banking Environment (OBE), and also through Plaid. In the consent flow a
    customer is redirected to National Bank to authenticate and approve data
    sharing (an OAuth-style redirect/token grant), after which data flows over a
    secure, FDX-aligned feed. Fintechs onboard through the aggregator's
    accreditation process, not a National Bank developer console.

    National Bank and Flinks are founding participants of the FDX Canada working
    group, aligning data-sharing on the FDX technical standard. The bank has
    publicly positioned itself ahead of Canada's Consumer-Driven Banking
    framework (Budget 2024 / FCAC oversight), which is legislated but not yet
    operational — there is no live mandate and no framework endpoint. No
    first-party OpenAPI was harvested because none is publicly published.
